services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # sadece backend erişir, dışarıya port açılmıyor

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "127.0.0.1:13742:3000"
    depends_on:
      - redis

volumes:
  redis_data:
