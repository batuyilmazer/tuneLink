name: tuneLink

options:
  bundleIdPrefix: pizza.bira
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:

  tuneLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: tuneLink
      - path: Shared
    info:
      path: tuneLink/Info.plist
      properties:
        CFBundleDisplayName: tuneLink
        CFBundleURLTypes:
          - CFBundleURLName: Spotify Auth
            CFBundleURLSchemes:
              - tunelinkapp
        BASE_URL: "https://api.tunelink.bira.pizza"
        SPOTIFY_CLIENT_ID: "SPOTIFY_CLIENT_ID_HERE"
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: tuneLink/tuneLink.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pizza.bira.tunelink
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pizza.bira.tuneLink
    dependencies:
      - target: tuneLinkWidget
        embed: true

  tuneLinkWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: tuneLinkWidget
      - path: Shared
    info:
      path: tuneLinkWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BASE_URL: "https://api.tunelink.bira.pizza"
    entitlements:
      path: tuneLinkWidget/tuneLinkWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pizza.bira.tunelink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pizza.bira.tuneLink.widget
